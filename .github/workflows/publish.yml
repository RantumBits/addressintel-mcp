name: Publish

# Publishes to npm via npm Trusted Publishing (GitHub OIDC). There is no
# NPM_TOKEN and no OTP: npm mints a short-lived credential from the OIDC token
# GitHub issues to this workflow, so nothing long-lived is stored anywhere.
#
# ONE-TIME SETUP, on npmjs.com and not in this repo:
#   npmjs.com -> addressintel-mcp -> Settings -> Trusted Publisher -> GitHub Actions
#   organization/user: RantumBits
#   repository:        addressintel-mcp
#   workflow filename: publish.yml      <- must match THIS file's name
#   environment:       (leave empty, this workflow declares none)
# Until that is saved, this workflow fails at the publish step with a 404 or
# 403, which means "npm does not recognise this repo as a publisher yet", not
# "the build is broken".
#
# Releasing: bump the version (package.json, package-lock.json AND both fields
# in server.json), commit, then push a matching tag:
#   git tag v1.1.2 && git push origin v1.1.2
# The tag is what triggers this. The guard below refuses to publish if the tag
# and package.json disagree, because a mismatch would ship a version nobody
# asked for and the registry will not let you take it back.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required: lets GitHub issue the OIDC token npm exchanges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships older than that.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "version $PKG confirmed"

      # server.json is what the MCP registries read. If it drifts from
      # package.json the directories advertise a version npm does not serve.
      - name: server.json must match package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          node -e '
            const s = require("./server.json");
            const pkg = require("./package.json").version;
            const found = [s.version, ...(s.packages ?? []).map(p => p.version)];
            const bad = found.filter(v => v !== pkg);
            if (bad.length) {
              console.error(`server.json has ${JSON.stringify(found)}, package.json has ${pkg}`);
              process.exit(1);
            }
            console.log(`server.json agrees at ${pkg}`);
          '

      - run: npm publish --provenance --access public
